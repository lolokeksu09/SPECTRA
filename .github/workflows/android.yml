name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub-hosted Android SDK is missing}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify baseline Legion Y70 v9 assets
        run: python3 scripts/check-v9-models.py
      - name: Install Python dependencies for offline model packaging
        run: python3 -m pip install --disable-pip-version-check numpy==2.3.5 pillow==12.3.0 trimesh==4.11.1
      - name: Build validated White v15 base into APK assets
        shell: bash
        run: |
          set -euo pipefail
          cp app/src/main/assets/models/legion_y70_white.glb /tmp/legion_y70_white_v9.glb
          python3 scripts/build-white-v15-mobile.py \
            /tmp/legion_y70_white_v9.glb \
            app/src/main/assets/models/legion_y70_white.glb
      - name: Refine White v17 camera geometry and aligned USB-C antenna seams
        run: python3 scripts/refine-white-v17.py app/src/main/assets/models/legion_y70_white.glb
      - name: Preserve v17 for exported-geometry and Android render comparison
        run: |
          mkdir -p build/model-evidence app/src/androidTest/assets/models
          cp app/src/main/assets/models/legion_y70_white.glb build/model-evidence/white-v17.glb
      - name: Refine and validate White v18 for Filament
        run: |
          python3 scripts/refine-white-v18.py build/model-evidence/white-v17.glb app/src/main/assets/models/legion_y70_white.glb
          python3 scripts/check-white-v18.py build/model-evidence/white-v17.glb app/src/main/assets/models/legion_y70_white.glb --report build/model-evidence/v18-checks.json
          cp app/src/main/assets/models/legion_y70_white.glb build/model-evidence/white-v18.glb
      - name: Refine and verify White v19 volume rocker and exposed side antenna seams
        run: |
          python3 scripts/refine-white-v19.py build/model-evidence/white-v18.glb app/src/main/assets/models/legion_y70_white.glb
          python3 scripts/check-white-v19.py build/model-evidence/white-v18.glb app/src/main/assets/models/legion_y70_white.glb --report build/model-evidence/v19-checks.json
          cp app/src/main/assets/models/legion_y70_white.glb build/model-evidence/white-v19.glb
      - name: Refine and verify White v20 matching rounded power and smart keys
        run: |
          python3 scripts/refine-white-v20.py build/model-evidence/white-v19.glb app/src/main/assets/models/legion_y70_white.glb
          python3 scripts/check-white-v20.py build/model-evidence/white-v19.glb app/src/main/assets/models/legion_y70_white.glb --report build/model-evidence/v20-checks.json
          cp app/src/main/assets/models/legion_y70_white.glb build/model-evidence/white-v20.glb
      - name: Refine and verify White v21 side details
        run: |
          python3 scripts/refine-white-v21.py build/model-evidence/white-v20.glb app/src/main/assets/models/legion_y70_white.glb
          python3 scripts/check-white-v21.py build/model-evidence/white-v20.glb app/src/main/assets/models/legion_y70_white.glb --report build/model-evidence/v21-checks.json
          cp app/src/main/assets/models/legion_y70_white.glb build/model-evidence/white-v21.glb
          cp build/model-evidence/white-v21.glb app/src/androidTest/assets/models/white-v21.glb
      - name: Refine and validate White v22 camera elevations
        run: |
          python3 scripts/refine-white-v22.py build/model-evidence/white-v21.glb app/src/main/assets/models/legion_y70_white.glb
          python3 scripts/check-white-v22.py build/model-evidence/white-v21.glb app/src/main/assets/models/legion_y70_white.glb --report build/model-evidence/v22-checks.json
          cp app/src/main/assets/models/legion_y70_white.glb build/model-evidence/white-v22.glb
      - name: Khronos glTF validation including normals, UVs and tangent frames
        run: |
          npm install --prefix "$RUNNER_TEMP/gltf-validation" --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          NODE_PATH="$RUNNER_TEMP/gltf-validation/node_modules" node scripts/validate-glb.cjs build/model-evidence/white-v22.glb build/model-evidence/gltf-validator.json
      - name: Test and build
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Enable KVM for actual Android Filament rendering
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Filament v21 and v22 render regression with all side keys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/run-filament-android-tests.sh
      - name: Archive model and Android verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: White-v22-verification
          path: |
            build/model-evidence/
            app/build/reports/tests/
            app/build/reports/androidTests/
          if-no-files-found: error
      - name: Archive debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRA-0.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to Releases for every main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/model-evidence && zip -qr ../../White-v22-verification.zip . && cd ../..
          gh release create "v0.2.0-dev.${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk White-v22-verification.zip \
            --target "$GITHUB_SHA" --title "SPECTRA 0.2 · White v22 · build ${GITHUB_RUN_NUMBER}" \
            --notes "White v22: raised left optical assemblies and near-flush right sensor/flash rings, preserving camera centres and materials. Debug APK unit-tested and rendered using Android Filament on API 35 emulator at commit ${GITHUB_SHA}. Includes before/after GLBs, geometry checks and 18 Filament screenshots. Physical Legion Y70 testing and hardware FPS remain pending. Debug-signed, not production-signed." --prerelease
      - name: Publish tagged development release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/app-debug.apk --title "SPECTRA ${GITHUB_REF_NAME} (debug)" --notes "Development APK (debug-signed). Not production-signed." --prerelease
