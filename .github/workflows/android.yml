name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub-hosted Android SDK is missing}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Archive debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRA-0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to Releases for every main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-dev.${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" --title "SPECTRA 0.1 · build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built and unit-tested at commit ${GITHUB_SHA}. Hardware validation pending." --prerelease
      - name: Publish tagged development release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/app-debug.apk --title "SPECTRA ${GITHUB_REF_NAME} (debug)" --notes "Development APK (debug-signed). Not production-signed." --prerelease
